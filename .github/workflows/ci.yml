name: Windows build and tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  media-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-win32 mingw-w64-common mingw-w64-x86-64-dev nasm make pkg-config python3 xz-utils
      - name: Build bundled media tools and corresponding sources
        run: bash scripts/Build-Ffmpeg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-tools-win-x64
          path: artifacts/ffmpeg-native/
          if-no-files-found: error
  verify:
    needs: media-tools
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Download bundled media tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name media-tools-win-x64 --dir artifacts/ffmpeg-native
      - name: Use bundled FFmpeg for integration tests
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path src/WallpaperSceneExporter/ffmpeg -Force | Out-Null
          Copy-Item artifacts/ffmpeg-native/*.exe src/WallpaperSceneExporter/ffmpeg/ -Force
      - name: Restore locked dependencies
        run: dotnet restore WallpaperSceneExporter.sln --locked-mode -p:Platform=x64
      - name: Build Release
        run: dotnet build WallpaperSceneExporter.sln -c Release -p:Platform=x64 --no-restore -warnaserror
      - name: Run tests
        run: dotnet test WallpaperSceneExporter.sln -c Release -p:Platform=x64 --no-build --no-restore --logger trx --results-directory TestResults
      - name: Check NuGet advisories
        run: dotnet list WallpaperSceneExporter.sln package --vulnerable --include-transitive --no-restore
      - name: Package portable application
        shell: powershell
        run: ./scripts/Publish.ps1
      - name: Upload portable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node 24)
        with:
          name: WallpaperEngineSceneExporter-win-x64
          path: |
            artifacts/WallpaperEngineSceneExporter-*-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
